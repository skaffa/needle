plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			// Keep the dev game small enough for 8 GB machines.
			vmArgs "-Xms256M", "-Xmx2G"
			// ./gradlew runClient -Pdevtest: scripted jukebox test in a singleplayer world;
			// -Pdevtest=screen: screenshot of the settings screen from the title screen (see DevTest)
			if (project.hasProperty("devtest")) {
				def mode = project.property("devtest").toString()
				property "needle.devtest", mode.isEmpty() ? "1" : mode
			}
		}
	}

	mods {
		"needle" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
	maven {
		name = 'Terraformers'
		url = 'https://maven.terraformersmc.com/releases/'
		content {
			includeGroup 'com.terraformersmc'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional: "Configure" button in Mod Menu. Not bundled; also loaded in the dev client.
	clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Core (src/main) never imports Minecraft classes, so it is tested with plain JUnit.
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Last.fm API key and secret come from ~/.gradle/gradle.properties (lastfm.apiKey, lastfm.apiSecret)
// and are written into a generated class, so they never end up in git. Empty when not set;
// players can then enter their own in config/needle.json.
def generatedKeysDir = layout.buildDirectory.dir("generated/sources/lastfmKeys")
def generateLastFmKeys = tasks.register("generateLastFmKeys") {
	def apiKey = providers.gradleProperty("lastfm.apiKey").orElse("")
	def apiSecret = providers.gradleProperty("lastfm.apiSecret").orElse("")
	inputs.property "apiKey", apiKey
	inputs.property "apiSecret", apiSecret
	outputs.dir generatedKeysDir
	doLast {
		def file = generatedKeysDir.get().file("dev/needle/core/BuiltInKeys.java").asFile
		file.parentFile.mkdirs()
		file.text = """package dev.needle.core;

/** Generated by the generateLastFmKeys Gradle task. Do not edit. */
public final class BuiltInKeys {
	public static final String API_KEY = "${apiKey.get()}";
	public static final String API_SECRET = "${apiSecret.get()}";

	private BuiltInKeys() {
	}
}
"""
	}
}
sourceSets.main.java.srcDir(generateLastFmKeys)
// The key is compiled into the jar, but keep the readable source out of the published sources jar.
tasks.withType(Jar).matching { it.name == "sourcesJar" }.configureEach {
	exclude "dev/needle/core/BuiltInKeys.java"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

test {
	useJUnitPlatform()
	// Minecraft's logger writes logs/ into the working directory; keep it out of the project root
	def testDir = layout.buildDirectory.dir("test-run").get().asFile
	workingDir = testDir
	doFirst { testDir.mkdirs() }
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
